<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Price Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="card shadow-lg p-4">

        <h1 class="text-center mb-4">
            🚗 Car Price Prediction
        </h1>

        <form action="/predict" method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Year</label>
                    <input type="number" class="form-control" name="Year" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Present Price (Lakhs)</label>
                    <input type="number" step="0.01" class="form-control" name="Present_Price" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Kms Driven</label>
                    <input type="number" class="form-control" name="Kms_Driven" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Owner</label>
                    <input type="number" class="form-control" name="Owner" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Fuel Type</label>

                    <select class="form-select" name="Fuel_Type">

                        <option>Petrol</option>
                        <option>Diesel</option>
                        <option>CNG</option>

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label>Seller Type</label>

                    <select class="form-select" name="Seller_Type">

                        <option>Dealer</option>
                        <option>Individual</option>

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label>Transmission</label>

                    <select class="form-select" name="Transmission">

                        <option>Manual</option>
                        <option>Automatic</option>

                    </select>

                </div>

            </div>

            <button class="btn btn-primary w-100 mt-3">
                Predict Price
            </button>

        </form>

        {% if prediction_text %}

        <div class="alert alert-success mt-4 text-center">

            <h3>{{ prediction_text }}</h3>

        </div>

        {% endif %}

        {% if accuracy %}

        <div class="card mt-4">

            <div class="card-body text-center">

                <h2>Model Performance</h2>

                <hr>

                <h4>Accuracy (R²)</h4>

                <h3>{{ accuracy }}%</h3>

                <hr>

                <h4>Mean Absolute Error</h4>

                <h3>{{ mae }}</h3>

                <hr>

                <h4>Root Mean Squared Error</h4>

                <h3>{{ rmse }}</h3>

            </div>

        </div>

        {% endif %}

    </div>

</div>

</body>
</html>
